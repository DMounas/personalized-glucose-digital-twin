<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#166534" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" rx="14" fill="#F8FBF9" stroke="#D6E8DC" stroke-width="2"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="56" rx="14" fill="#FFFFFF" stroke="#D6E8DC" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="6" fill="#EF4444"/>
  <circle cx="50" cy="28" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="28" r="6" fill="#16A34A"/>
  <text x="105" y="33" fill="#166534" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="1">GLUCOSE DIGITAL TWIN</text>
  <text x="280" y="33" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12">|</text>
  <text x="295" y="33" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="12">Interactive Research Dashboard (Streamlit)</text>
  <rect x="1040" y="14" width="130" height="28" rx="6" fill="#E8F5E9" stroke="#86EFAC" stroke-width="1"/>
  <text x="1105" y="32" fill="#166534" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">streamlit run app.py</text>

  <!-- Left Sidebar Mockup -->
  <g transform="translate(24, 76)">
    <rect width="250" height="580" rx="10" fill="#F0F7F3" stroke="#D6E8DC" stroke-width="1.2"/>
    <rect x="16" y="20" width="130" height="20" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="81" y="34" fill="#166534" font-family="Segoe UI, Inter, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RESEARCH PROTOTYPE</text>
    <text x="16" y="65" fill="#0F291E" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="800">GLUCOSE DIGITAL TWIN</text>
    <text x="16" y="82" fill="#4B6354" font-family="Segoe UI, Inter, sans-serif" font-size="10">Forecasting &amp; Personalization</text>

    <!-- Nav Items -->
    <text x="16" y="125" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">NAVIGATION</text>

    <rect x="12" y="140" width="226" height="36" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/>
    <text x="24" y="163" fill="#15803D" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">Project Overview</text>

    <rect x="12" y="185" width="226" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="208" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">Global Forecasting Explorer</text>

    <rect x="12" y="230" width="226" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="253" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">Personalization Lab</text>

    <rect x="12" y="275" width="226" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="298" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">Methodology &amp; Guard Band</text>

    <!-- Cohort Badges -->
    <rect x="12" y="340" width="226" height="110" rx="8" fill="#FFFFFF" stroke="#D6E8DC"/>
    <text x="24" y="362" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">COHORT METADATA</text>
    <text x="24" y="385" fill="#1E293B" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">• PhysioNet CGMacros (45 Subj)</text>
    <text x="24" y="405" fill="#1E293B" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">• 10 Repeats × 5 Disjoint Folds</text>
    <text x="24" y="425" fill="#1E293B" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">• 123,599 Evaluation Origins</text>

    <!-- Disclaimer snippet -->
    <rect x="12" y="475" width="226" height="85" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="24" y="497" fill="#166534" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="800">NON-CLINICAL DISCLAIMER</text>
    <text x="24" y="517" fill="#14532D" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">Benchmarking research prototype.</text>
    <text x="24" y="533" fill="#14532D" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">Not certified for medical decisions.</text>
  </g>

  <!-- Right Main Dashboard Area -->
  <g transform="translate(296, 76)">
    <!-- Header title -->
    <text x="0" y="24" fill="#0F291E" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="900">Personalized Glucose Digital Twin Dashboard</text>
    <text x="0" y="46" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="12">Interactive exploration of 8 population model rungs and chronological residual personalization.</text>

    <!-- 4 KPI Cards -->
    <g transform="translate(0, 65)">
      <!-- Card 1 -->
      <rect width="208" height="78" rx="8" fill="#FFFFFF" stroke="#D6E8DC" filter="url(#cardShadow)"/>
      <text x="16" y="24" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">COHORT</text>
      <text x="16" y="52" fill="#14532D" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">45 Subjects</text>
      <text x="16" y="68" fill="#16A34A" font-family="Segoe UI, Inter, sans-serif" font-size="10">Normal / Prediab / T2D</text>

      <!-- Card 2 -->
      <g transform="translate(224, 0)">
        <rect width="208" height="78" rx="8" fill="#FFFFFF" stroke="#D6E8DC" filter="url(#cardShadow)"/>
        <text x="16" y="24" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">CROSS-VALIDATION</text>
        <text x="16" y="52" fill="#14532D" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">50 Folds</text>
        <text x="16" y="68" fill="#16A34A" font-family="Segoe UI, Inter, sans-serif" font-size="10">Participant-disjoint splits</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(448, 0)">
        <rect width="208" height="78" rx="8" fill="#FFFFFF" stroke="#D6E8DC" filter="url(#cardShadow)"/>
        <text x="16" y="24" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">POPULATION SKILL</text>
        <text x="16" y="52" fill="#14532D" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">+11.85%</text>
        <text x="16" y="68" fill="#16A34A" font-family="Segoe UI, Inter, sans-serif" font-size="10">Rung 5 Ridge vs Pers (+60m)</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(672, 0)">
        <rect width="208" height="78" rx="8" fill="#FFFFFF" stroke="#D6E8DC" filter="url(#cardShadow)"/>
        <text x="16" y="24" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700">6-DAY ADAPTATION</text>
        <text x="16" y="52" fill="#15803D" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">-1.81 mg/dL</text>
        <text x="16" y="68" fill="#16A34A" font-family="Segoe UI, Inter, sans-serif" font-size="10">8.0% error drop (40/45 imp)</text>
      </g>
    </g>

    <!-- Interactive Visual Panel Mockup -->
    <g transform="translate(0, 160)">
      <rect width="880" height="420" rx="10" fill="#FFFFFF" stroke="#D6E8DC"/>

      <!-- Controls row -->
      <rect x="20" y="16" width="300" height="34" rx="6" fill="#F0F7F3" stroke="#D6E8DC"/>
      <rect x="22" y="18" width="145" height="30" rx="5" fill="#15803D"/>
      <text x="94" y="38" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+60-Minute Horizon</text>
      <text x="235" y="38" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+30-Minute Horizon</text>

      <rect x="340" y="16" width="360" height="34" rx="6" fill="#F0F7F3" stroke="#D6E8DC"/>
      <text x="360" y="38" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">2 Days</text>
      <text x="460" y="38" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600">4 Days</text>
      <rect x="540" y="18" width="156" height="30" rx="5" fill="#15803D"/>
      <text x="618" y="38" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6 Study Days (Selected)</text>

      <!-- Plot Area -->
      <g transform="translate(40, 70)">
        <text x="0" y="18" fill="#0F291E" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800">Dose-Response Trajectory: Matched Global Ridge vs. Personalized Residual Calibration</text>
        <line x1="50" y1="280" x2="780" y2="280" stroke="#CBD5E1" stroke-width="1.5"/>
        <line x1="50" y1="40" x2="50" y2="280" stroke="#CBD5E1" stroke-width="1.5"/>

        <!-- Grid lines -->
        <line x1="50" y1="100" x2="780" y2="100" stroke="#E2E8F0" stroke-dasharray="3,3"/>
        <line x1="50" y1="160" x2="780" y2="160" stroke="#E2E8F0" stroke-dasharray="3,3"/>
        <line x1="50" y1="220" x2="780" y2="220" stroke="#E2E8F0" stroke-dasharray="3,3"/>

        <!-- Y Axis ticks -->
        <text x="40" y="104" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="10" text-anchor="end">26 mg/dL</text>
        <text x="40" y="164" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="10" text-anchor="end">24 mg/dL</text>
        <text x="40" y="224" fill="#64748B" font-family="Segoe UI, Inter, sans-serif" font-size="10" text-anchor="end">22 mg/dL</text>

        <!-- 2 Day Group -->
        <rect x="130" y="125" width="45" height="155" fill="#94A3B8" rx="3"/>
        <rect x="180" y="127" width="45" height="153" fill="#15803D" rx="3"/>
        <text x="177" y="300" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2 Days (25.17)</text>

        <!-- 4 Day Group -->
        <rect x="360" y="145" width="45" height="135" fill="#94A3B8" rx="3"/>
        <rect x="410" y="180" width="45" height="100" fill="#15803D" rx="3"/>
        <text x="407" y="300" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4 Days (23.38)</text>

        <!-- 6 Day Group -->
        <rect x="590" y="159" width="45" height="121" fill="#94A3B8" rx="3"/>
        <rect x="640" y="213" width="45" height="67" fill="#15803D" rx="3"/>
        <text x="637" y="300" fill="#15803D" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">6 Days (22.26 mg/dL)</text>

        <!-- Benefit Callout Tag -->
        <rect x="580" y="70" width="180" height="30" rx="6" fill="#DCFCE7" stroke="#86EFAC"/>
        <text x="670" y="89" fill="#166534" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Δ -1.81 mg/dL [p &lt; 0.05]</text>
      </g>
    </g>
  </g>
</svg>
