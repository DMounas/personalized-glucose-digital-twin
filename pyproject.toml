[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-digital-twin"
version = "0.1.0"
description = "Proof-of-concept healthcare Digital Twin for type 2 diabetes (glucose forecasting + what-if scenarios + clinician dashboard)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
dtwin-audit = "dtwin.audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by ruff format; string literals left unbroken
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["import-untyped", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "yaml",
    "yaml.*",
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.test_profiling"
ignore_errors = true



