# Schema Aliases Configuration for CGMacros Ingestion
# Defines explicit, name-based column mappings to canonical field names.
# Never relies on column position.
# Supports whitespace normalization, case-insensitivity, and strict vs permissive modes.

version: "1.0.0"

settings:
  strict_mode_default: true
  normalize_whitespace: true
  case_insensitive_matching: true

